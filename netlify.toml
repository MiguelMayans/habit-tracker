# Client and API on the same Netlify site. Living on one domain is what removes
# any CORS to configure in production.
#
# The build runs from the ROOT and not with `base = "client"`: this is a pnpm
# workspace, and launching the install inside client/ makes pnpm resolve the
# workspace from somewhere that is not its root.
#
# The server is built BEFORE the client because the function imports its
# already-built JavaScript (see netlify/functions/api.mjs).
[build]
  command = "pnpm --filter server build && pnpm --filter client build"
  publish = "client/dist"
  functions = "netlify/functions"

[build.environment]
  # Without this, Netlify picks a Node version on its own, which may not be the
  # one that compiles this project.
  NODE_VERSION = "22"
  # The API is served from the same place, so a relative path is enough. Not
  # being an absolute URL, there is also nothing to fill in by hand in the UI.
  VITE_API_URL = "/api"

# The redirect rules do NOT live here: both sit together, in order, in
# client/public/_redirects. Split across the two files they depended on the
# precedence between them, and the SPA catch-all ended up swallowing the calls
# to /api.
