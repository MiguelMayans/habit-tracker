# Se construye desde la RAÍZ y no con `base = "client"`. Esto es un workspace
# de pnpm: el lockfile y pnpm-workspace.yaml viven arriba, y si la instalación
# se lanza dentro de client/ pnpm resuelve el workspace desde un sitio que no
# es su raíz. Con `--filter` se instala una vez arriba y se construye solo el
# cliente.
[build]
  command = "pnpm --filter client build"
  publish = "client/dist"

[build.environment]
  # Sin esto Netlify elige una versión de Node por su cuenta, que puede no ser
  # la que compila este proyecto.
  NODE_VERSION = "22"

# VITE_API_URL se configura en el panel de Netlify, no aquí: apunta al backend
# de Render y no tiene por qué vivir en el repositorio.
