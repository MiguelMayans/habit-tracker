<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/favicon-64.png" />
    <!-- iOS ignores the manifest's icons and looks for this one instead. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- The browser chrome colour on Android, before and after installing. -->
    <meta name="theme-color" content="#000000" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Dela+Gothic+One&display=swap"
      rel="stylesheet"
    />
    <!-- Big figures (levels, the date, the streak) use Archivo Black: Dela
         Gothic's 5 nearly closes into a 6 under a thick outline. Only the ten
         digits are downloaded (`text=`). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&text=0123456789&display=swap"
      rel="stylesheet"
    />
    <title>Mike's Life</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
